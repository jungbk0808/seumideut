[package]
name = "seumideut-desktop"
version = "0.1.0"
description = "스미듯: 떠오른 생각을 언제 어디서나 가볍게 남기는 기록 공간"
authors = ["jbg"]
edition = "2021"

[lib]
name = "seumideut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
